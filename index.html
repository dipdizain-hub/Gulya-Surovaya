<!DOCTYPE html>
<html lang="ru" data-font-scale="normal" data-theme="day">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E5E0D5">
  <meta name="description" content="Книга вязания спицами — удобный современный каталог проверенных описаний и схем крупным шрифтом.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Книга вязания">
  <title>Книга вязания спицами</title>
  <link rel="preload" as="image" href="./assets/images/welcome-gulsinya.webp?v=6" type="image/webp">
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg?v=6">
  <link rel="apple-touch-icon" href="./assets/icon.svg?v=6">
  <link rel="manifest" href="./manifest.webmanifest?v=6">
  <link rel="stylesheet" href="./styles.css?v=6">
</head>
<body>
  <a href="#app-main" class="skip-link">Перейти к содержимому</a>

  <!-- Верхняя панель: на главной — крупное Сердечко, в статье — кнопка Назад; справа — А+ и Вечер. При прокрутке вниз скрывается -->
  <header id="site-header" class="site-header no-print" role="banner">
    <div class="header-inner">
      <div id="header-left" class="header-left">
        <button type="button" id="btn-header-fav" class="header-heart-btn" data-action="open-fav-popup" aria-label="Открыть избранное">
          <svg class="heart-svg" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
          <span id="header-fav-badge" class="header-fav-badge" hidden>0</span>
        </button>
      </div>

      <div class="header-controls" role="group" aria-label="Настройки чтения">
        <button type="button" id="btn-font-scale" class="ctrl-btn" aria-label="Изменить размер шрифта">
          <span class="ctrl-btn-big" aria-hidden="true">А+</span>
          <span id="font-scale-label" class="ctrl-btn-text">100%</span>
        </button>

        <button type="button" id="btn-theme-toggle" class="ctrl-btn" aria-pressed="false" aria-label="Вечерний режим">
          <span id="theme-icon" class="ctrl-btn-icon" aria-hidden="true">🌙</span>
          <span id="theme-label" class="ctrl-btn-text">Вечер</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Основная область контента -->
  <main id="app-main" class="app-main" tabindex="-1" aria-live="off">
    <noscript>
      <div class="noscript-box">
        <h2>Пожалуйста, включите JavaScript в настройках браузера</h2>
        <p>Для отображения каталога схем и голосовой озвучки требуется включённый JavaScript.</p>
      </div>
    </noscript>
    <div class="loading-card no-print">Загружаем каталог…</div>
  </main>

  <!-- Всплывающее окно «Избранное» (popup поверх экрана с полупрозрачными карточками) -->
  <div id="favorites-popup" class="fav-popup-backdrop no-print" role="dialog" aria-modal="true" aria-labelledby="fav-popup-title" hidden>
    <div class="fav-popup-sheet">
      <div class="fav-popup-header">
        <h2 id="fav-popup-title" class="fav-popup-title">Избранное</h2>
        <button type="button" id="btn-fav-popup-close" class="popup-close-btn" aria-label="Закрыть избранное">✕</button>
      </div>
      <div id="favorites-popup-list" class="fav-popup-list"></div>
    </div>
  </div>

  <!-- Плавающие боковые кнопки управления озвучкой (не перекрывают текст) -->
  <div id="tts-fab-rail" class="tts-fab-rail no-print" role="region" aria-label="Управление голосовым чтением" hidden>
    <button type="button" id="fab-tts-toggle" class="tts-fab-btn tts-fab-primary" aria-label="Пауза или продолжить чтение">
      <span id="fab-tts-toggle-icon" class="tts-fab-icon" aria-hidden="true">⏸</span>
      <span id="fab-tts-toggle-text" class="tts-fab-label">Пауза</span>
    </button>

    <button type="button" id="fab-tts-speed" class="tts-fab-btn" aria-label="Изменить скорость голоса">
      <span id="fab-tts-speed-val" class="tts-fab-speed-num">0.6×</span>
      <span class="tts-fab-label">Темп</span>
    </button>

    <button type="button" id="fab-tts-repeat" class="tts-fab-btn" aria-label="Повторить текущий абзац">
      <span class="tts-fab-icon" aria-hidden="true">↺</span>
      <span class="tts-fab-label">Повтор</span>
    </button>

    <button type="button" id="fab-tts-next" class="tts-fab-btn" aria-label="Следующий абзац">
      <span class="tts-fab-icon" aria-hidden="true">⏭</span>
      <span class="tts-fab-label">Дальше</span>
    </button>

    <button type="button" id="fab-tts-stop" class="tts-fab-btn tts-fab-stop" aria-label="Остановить чтение">
      <span class="tts-fab-icon" aria-hidden="true">✕</span>
      <span class="tts-fab-label">Стоп</span>
    </button>
  </div>

  <!-- Полноэкранный просмотр схемы: 100% экрана, автоскрытие текста (12 сек), кнопка «Скрыть» и переключение кликом по схеме -->
  <div id="chart-modal" class="chart-modal no-print" role="dialog" aria-modal="true" aria-label="Просмотр схемы" hidden>
    <div id="chart-viewport" class="chart-viewport">
      <div id="chart-stage" class="chart-stage">
        <img id="chart-modal-img" src="" alt="" draggable="false">
      </div>
    </div>

    <div id="chart-hint-bubble" class="chart-hint-bubble">
      <strong id="chart-modal-title" class="chart-bubble-title">Схема</strong>
      <p id="chart-modal-hint" class="chart-bubble-text"></p>
      <button type="button" id="btn-chart-hint-hide" class="chart-bubble-hide-btn">Скрыть</button>
    </div>

    <button type="button" id="btn-chart-close" class="chart-close-circle" aria-label="Закрыть схему">
      ✕
    </button>

    <div class="chart-corner-tools" role="group" aria-label="Масштаб и поворот">
      <button type="button" id="btn-chart-rotate" class="chart-mini-btn" aria-label="Повернуть горизонтально">↻</button>
      <button type="button" id="btn-zoom-out" class="chart-mini-btn" aria-label="Уменьшить">−</button>
      <button type="button" id="btn-zoom-reset" class="chart-mini-btn chart-mini-fit" aria-label="Во весь экран">1:1</button>
      <button type="button" id="btn-zoom-in" class="chart-mini-btn" aria-label="Увеличить">+</button>
    </div>
  </div>

  <!-- Ненавязчивое всплывающее уведомление -->
  <div id="toast-region" class="toast-region no-print" role="status" aria-live="polite" hidden></div>

  <!-- Приветственная открытка при входе на сайт (плавное появление по центру, закрытие по клику или через 6 сек) -->
  <div id="welcome-splash" class="welcome-splash no-print" role="dialog" aria-label="Добро пожаловать, Гульсиня">
    <div class="welcome-splash-glow" aria-hidden="true"></div>
    <div class="welcome-splash-card">
      <div class="welcome-splash-float">
        <picture>
          <source srcset="./assets/images/welcome-gulsinya.webp?v=6" type="image/webp">
          <img id="welcome-splash-img" class="welcome-splash-img" src="./assets/images/welcome-gulsinya.png?v=6" alt="Добро пожаловать, Гульсиня" draggable="false">
        </picture>
      </div>
    </div>
  </div>

  <script src="./data/articles.js?v=6"></script>
  <script src="./app.js?v=6"></script>
</body>
</html>
